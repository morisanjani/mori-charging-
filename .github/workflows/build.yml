name: Build Mori APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project
          echo "PROJECT_DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)" >> $GITHUB_ENV

      - name: Fix Java and Kotlin targets
        run: |
          cd "$PROJECT_DIR"
          find . -name build.gradle -o -name build.gradle.kts
          sed -i 's/JVM_1_8/JVM_17/g' app/build.gradle 2>/dev/null || true

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mori-APK
          path: project/**/build/outputs/apk/debug/*.apk
