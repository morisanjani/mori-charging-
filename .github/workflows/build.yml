name: Build Mori APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o Mori_Charging_Anime_CloudBuild.zip -d project
          echo "PROJECT_DIR=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)" >> $GITHUB_ENV

      - name: Fix Java target
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          s = p.read_text()

          s = re.sub(
              r'JavaVersion\.VERSION_1_8',
              'JavaVersion.VERSION_17',
              s
          )

          s = re.sub(
              r'JavaVersion\.VERSION_8',
              'JavaVersion.VERSION_17',
              s
          )

          s = re.sub(
              r'(sourceCompatibility\s*=\s*)["\']1\.8["\']',
              r'\1JavaVersion.VERSION_17',
              s
          )

          s = re.sub(
              r'(targetCompatibility\s*=\s*)["\']1\.8["\']',
              r'\1JavaVersion.VERSION_17',
              s
          )

          p.write_text(s)
          print("Java target updated to 17")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mori-APK
          path: project/**/build/outputs/apk/debug/*.apk
